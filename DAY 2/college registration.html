<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Registration Form</title>

    <style>

        body{
            background-color:ghostwhite;
        }

        form{
            width:450px;
            margin:auto;
            padding:20px;
        }

        h1{
            color:rgba(85,37,168,0.967);
            text-align:center;
        }

        p{
            font-size:14pt;
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight:bold;
            background-color:rgb(222,183,220);
            text-align:center;
            padding:8px;
        }

        h2{
            background-color:rgb(222,195,234);
            color:black;
            padding:8px;
        }

        input,select,textarea{
            width:100%;
            padding:8px;
            margin-top:5px;
            margin-bottom:10px;
            box-sizing:border-box;
        }

        input[type="radio"]{
            width:auto;
            margin-right:5px;
        }

        input[type="submit"]{
            width:120px;
            display:block;
            margin:auto;
        }

    </style>

</head>

<body>

<form>

<h1>College Registration Form</h1>

<p>Submit this form for Online Registration</p>

<h2>Personal Information</h2>

<label>Name:</label><br>
<input type="text" id="txtName" placeholder="Enter your name" required><br>

<label>Email:</label><br>
<input type="email" id="txtemail" placeholder="Enter your Email" required><br>

<label>Phone No:</label><br>
<input type="text" id="txtPhone" placeholder="Enter your Phone No" required><br>

<label>Gender:</label><br>

<input type="radio" name="gender"> Male<br>
<input type="radio" name="gender"> Female<br>
<input type="radio" name="gender"> Transgender<br>
<input type="radio" name="gender"> Others<br><br>

<label>Date of Birth:</label><br>
<input type="date" id="dtDOB"><br>

<label>Address:</label><br>
<textarea id="address" placeholder="Enter your address"></textarea><br>

<h2>Courses</h2>

<label>Desired Course:</label><br>

<select>
    <option selected disabled>Select your course</option>
    <option>Artificial Intelligence</option>
    <option>DSA</option>
    <option>Civil Engineering</option>
    <option>Computer Science Engineering</option>
    <option>Mechanical Engineering</option>
    <option>Aeronautical Engineering</option>
    <option>Electrical Engineering</option>
    <option>Information Technology</option>
    <option>MBA</option>
</select>

<label> choose year</label>
<select> 
    <option selected disabled>select your year</option>
    <option> 1st year</option>
    <option> 2nd year</option>
    <option> 3rd year</option>
    <option> 4th year</option>
</select>
<br>

<input type="submit" value="Submit">

</form>

</body>
</html>
