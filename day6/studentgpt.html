<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Records</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body class="bg-light">

    <div class="container py-5">
        <h2 class="text-center mb-4">Student Records</h2>

        <input type="text" id="search" class="form-control mb-4" placeholder="Search Student">

        <div id="container" class="row g-4"></div>
        <div class="container mt-4">
    <h4>Student JSON</h4>
    <pre id="json"></pre>
</div>
    </div>

    <script>
        const students = [
            { name: "Shivgami", branch: "CSE", cgpa: 8.4,image:"images/shivgami.jpg" },
            { name: "Faluda", branch: "IT", cgpa: 9.0,image:"images/faluda.jpg" },
            { name: "Gajni", branch: "IT", cgpa: 9.4,image:"images/gajni.jpg" },
            { name: "Lalala", branch: "IT", cgpa: 7.0,image:"images/lalala.jpg" },
            { name: "karan", branch: "AI", cgpa: 8.0,image:"images/karan.jpg" },
            { name: "Jalebi", branch: "ECE", cgpa: 9.8,image:"images/jalebi.jpg" },
            { name: "Skibidi", branch: "AI", cgpa: 8.0,image:"images/skibidi.jpg" },
            { name: "Raise", branch: "CSE", cgpa: 8.2,image:"images/raise.jpg" },
            { name: "Pikachu", branch: "IT", cgpa: 8.0,image:"images/pikachu.jpg" },
            { name: "korma", branch: "CSE", cgpa: 8.9,image:"images/korma.jpg" }
        ];

        let html = "";

        for (let i = 0; i < students.length; i++) {
            html += `
<div class="col-md-4 card-item">
    <div class="card shadow h-100">

        <img src="${students[i].image}"
             class="card-img-top"
             alt="${students[i].name}"
             style="height:250px; object-fit:contain;background:#f8f9fa;"">

        <div class="card-body text-center">

            <h4>${students[i].name}</h4>

            <button class="btn btn-primary btn-sm mt-2">
                Show Details
            </button>

            <div class="details mt-3" style="display:none;">
                <p><strong>Branch:</strong> ${students[i].branch}</p>
                <p><strong>CGPA:</strong> ${students[i].cgpa}</p>
            </div>

        </div>
    </div>
</div>
`;
        }

        document.getElementById("container").innerHTML = html;

        // Show/Hide Details
        $(document).on("click", ".btn", function () {
            $(this).next(".details").toggle();
        });

        // Search Student
        $("#search").on("keyup", function () {
            let value = $(this).val().toLowerCase();

            $(".card-item").filter(function () {
                $(this).toggle(
                    $(this).text().toLowerCase().indexOf(value) > -1
                );
            });
        });

        document.getElementById("json").innerHTML=JSON.stringify(students, replacer ,4);        
     // 3. replacer (function)
      function replacer(key, value) {
    if (key === "cgpa") {
        return undefined;
    }
    return value;
}
       
       </script>
</body>
</html>
